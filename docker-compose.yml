
version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    ports:
      - '8000:8000'
    volumes:
      - .:/app
      - media_volume:/app/media
    environment:
      - DEBUG=1
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput || true && gunicorn config.wsgi:application --bind 0.0.0.0:8000"

volumes:
  media_volume:
  postgres_data:
